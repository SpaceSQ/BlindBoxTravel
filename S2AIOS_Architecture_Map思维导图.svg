<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1560" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">S2 AIOS 系统架构与生命关系思维导图</title>
  <desc id="desc">中心是独占常驻的 S2 AIOS。左侧是碳基生命、硅基生命和第三方 AIgent，右侧是空间地址、核心服务、进入方式和物理法则。底部五条是它们之间的交互。</desc>
  <style>
    .bg { fill: #f4f1ea; }
    .ink { fill: #1a1814; }
    .muted { fill: #5e584e; }
    .node { fill: #fffcf7; }
    .center { fill: #1a1814; }
    .center-text { fill: #f7f4ee; }
    .leaf { font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif; font-size: 16px; }
    .branch { font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif; font-size: 18px; font-weight: 500; }
    .small { font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif; font-size: 14px; }
    .tiny { font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif; font-size: 13px; }
  </style>
